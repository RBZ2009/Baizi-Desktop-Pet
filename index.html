<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>桌宠</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      body {
        position: relative;
        user-select: none;
        -webkit-user-select: none;
      }

      /* 桌宠容器（固定在窗口中心，不受输入框显隐影响） */
      #pet-container {
        width: 100%;
        height: 100%;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        cursor: grab;
      }

      #pet-container.dragging {
        cursor: grabbing;
      }

      /* 3D 画布 */
      #pet-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* 没有 VRM 模型时的 2D 兜底 */
      #pet-fallback {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 190px;
        height: 190px;
        transform: translate(-50%, -50%);
        background-image: url("./assets/pet.png");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0;
        pointer-events: none;
        transform-origin: 50% 85%;
        will-change: transform, filter;
      }

      #pet-fallback.active {
        opacity: 1;
      }

      #pet-fallback.pat {
        animation: fallback-pat 0.32s ease-out 1;
      }

      @keyframes fallback-pat {
        0% {
          transform: translate(-50%, -50%) scale(1);
        }
        55% {
          transform: translate(-50%, -58%) scale(1.08);
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
      }

      /* 粒子（点击反馈） */
      .particle {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(circle at 30% 30%, #ffffff, #8bd3ff);
        opacity: 0;
        transform: translate(-50%, -50%);
        animation: particle-pop 0.55s ease-out 1;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.18));
      }

      @keyframes particle-pop {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.6);
        }
        15% {
          opacity: 0.95;
        }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1);
        }
      }

      /* 调试面板（按 D 切换） */
      #debug {
        position: absolute;
        left: 8px;
        top: 8px;
        right: 8px;
        padding: 8px 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 11px;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.92);
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        pointer-events: none;
        opacity: 0;
        transition: opacity 120ms ease-out;
        white-space: pre-wrap;
      }

      #debug.show {
        opacity: 1;
      }

      #pet-shell {
        position: relative;
        width: 100%;
        height: 100%;
      }

    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/",
          "@pixiv/three-vrm": "./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
          "@pixiv/three-vrm-animation": "./node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="pet-shell">
      <div id="pet-container">
        <canvas id="pet-canvas"></canvas>
        <div id="pet-fallback"></div>
        <div id="debug"></div>
      </div>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
