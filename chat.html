<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>对白子说</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { user-select: none; -webkit-user-select: none; }
      #chat-panel {
        width: var(--panel-width, 156px);
        box-sizing: border-box;
        padding: 7px 10px;
        border: 1px solid rgba(255, 255, 255, 0.68);
        border-radius: 12px;
        background: rgba(225, 237, 246, 0.58);
        box-shadow: 0 5px 18px rgba(38, 57, 72, 0.14), inset 0 1px rgba(255, 255, 255, 0.78), inset 0 -1px rgba(255, 255, 255, 0.24);
        backdrop-filter: blur(24px) saturate(140%);
        -webkit-backdrop-filter: blur(24px) saturate(140%);
        opacity: 0;
        transform: translateY(-7px) scale(0.98);
        transform-origin: center top;
        transition: opacity 180ms ease, transform 220ms cubic-bezier(0.2, 0.75, 0.25, 1);
      }
      #chat-panel.show { opacity: 1; transform: translateY(0) scale(1); }
      #chat-input {
        display: block;
        width: 100%;
        min-height: 22px;
        max-height: 128px;
        box-sizing: border-box;
        border: 0;
        outline: 0;
        padding: 2px 1px;
        resize: none;
        overflow-x: hidden;
        overflow-y: hidden;
        overflow-wrap: anywhere;
        word-break: break-word;
        font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: rgba(28, 43, 55, 0.96);
        background: transparent;
        user-select: text;
        -webkit-user-select: text;
        transition: height 120ms ease-out;
      }
      #chat-input::placeholder { color: rgba(35, 53, 67, 0.58); }
      @media (prefers-reduced-motion: reduce) { #chat-panel, #chat-input { transition-duration: 1ms; } }
    </style>
  </head>
  <body>
    <div id="chat-panel"><textarea id="chat-input" rows="1" maxlength="12000" placeholder="和我说点什么…"></textarea></div>
    <script src="./chat-renderer.js"></script>
  </body>
</html>
